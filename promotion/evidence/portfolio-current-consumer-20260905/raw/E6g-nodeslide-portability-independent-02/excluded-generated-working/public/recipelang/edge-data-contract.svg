<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="472" viewBox="0 0 1440 472" role="img" aria-labelledby="recipe-title recipe-desc"><style>text{font-family:Arial,sans-serif}.title{font-size:34px;font-weight:700}.sub{font-size:15px;fill:#596170}.cell{fill:#fff;stroke:#aeb8c5;stroke-width:1.5}.input-cell{fill:#f4f7f9}.step-cell{fill:#fff}.output-cell{fill:#eef7f2}.contract{font-size:13px;fill:#6a7280}.label{font-size:17px;font-weight:650;fill:#17202a}.badge{font-size:11px;font-weight:700;letter-spacing:1px;fill:#fff}.stage{font-size:12px;font-weight:700;fill:#8a4b2c;letter-spacing:1px}.note{fill:#fff4d8;stroke:#e0b04b}</style><rect width="100%" height="100%" fill="#f7f5ef"/><text id="recipe-title" class="title" x="48" y="54">Treat the Edge as a Data Contract</text><text id="recipe-desc" class="sub" x="48" y="82">Deterministic plumbing before agent judgment</text><text class="stage" x="232" y="98">INPUT</text><g data-row-start="0" data-row-span="1"><rect class="cell input-cell" x="220" y="112" width="220" height="88" data-row-start="0" data-row-span="1"/><text class="label" x="234" y="146"><tspan x="234" dy="0">Research A</tspan></text><text class="contract" x="234" y="170"><tspan x="234" dy="0">Item[]</tspan></text></g><g data-row-start="1" data-row-span="1"><rect class="cell input-cell" x="220" y="200" width="220" height="88" data-row-start="1" data-row-span="1"/><text class="label" x="234" y="234"><tspan x="234" dy="0">Research B</tspan></text><text class="contract" x="234" y="258"><tspan x="234" dy="0">Item[]</tspan></text></g><g data-row-start="2" data-row-span="1"><rect class="cell input-cell" x="220" y="288" width="220" height="88" data-row-start="2" data-row-span="1"/><text class="label" x="234" y="322"><tspan x="234" dy="0">Research C</tspan></text><text class="contract" x="234" y="346"><tspan x="234" dy="0">Item[]</tspan></text></g><text class="stage" x="452" y="98">STAGE 0</text><g data-recipe-step="reduce-results" data-row-start="0" data-row-span="3"><rect class="cell step-cell" x="440" y="112" width="280" height="264"/><rect x="454" y="128" width="62" height="24" rx="12" fill="#206b57"/><text class="badge" x="466" y="144">CODE</text><text class="label" x="454" y="170"><tspan x="454" dy="0">Flatten → filter → dedupe</tspan></text><text class="contract" x="454" y="216"><tspan x="454" dy="0">DedupedItem[]</tspan></text></g><text class="stage" x="732" y="98">STAGE 1</text><g data-recipe-step="synthesize" data-row-start="0" data-row-span="3"><rect class="cell step-cell" x="720" y="112" width="280" height="264"/><rect x="734" y="128" width="67" height="24" rx="12" fill="#744fc6"/><text class="badge" x="746" y="144">AGENT</text><text class="label" x="734" y="170"><tspan x="734" dy="0">Judge and synthesize</tspan></text><text class="contract" x="734" y="216"><tspan x="734" dy="0">ResearchBrief</tspan></text></g><text class="stage" x="1012" y="98">OUTPUT</text><g data-recipe-output="final-brief" data-row-start="0" data-row-span="3"><rect class="cell output-cell" x="1000" y="112" width="220" height="264" data-row-start="0" data-row-span="3"/><text class="label" x="1014" y="146"><tspan x="1014" dy="0">Final research brief</tspan></text><text class="contract" x="1014" y="170"><tspan x="1014" dy="0">ResearchBrief</tspan></text></g><rect class="note" x="444" y="402" width="420" height="42" rx="10"/><text class="contract" x="456" y="428"><tspan x="456" dy="0">Save agents for judgment, not flattening and</tspan><tspan x="456" dy="16">deduplication.</tspan></text></svg>
